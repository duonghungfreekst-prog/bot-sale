[package]
name = "salehunter_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
libsql = { version = "0.10.0", features = ["remote", "core"] }
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp"] }
tao = "0.37"
tray-icon = { version = "0.26.1", default-features = false }
wry = "0.57.4"
