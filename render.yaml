services:
  - type: web
    name: bot-sale
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: vvipass_vip_bot
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: "10000"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CASHBACK_RATE
        value: "70.0"
      - key: REFERRAL_BONUS_RATE
        value: "10.0"
      - key: MIN_WITHDRAWAL_VND
        value: "50000"
      - key: ACCESSTRADE_API_TOKEN
        sync: false
      - key: ACCESSTRADE_DEEPLINK_TEMPLATE
        value: ""
